server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/foodrush_user
    username: ${DB_USERNAME:postgres}
    # CHANGE THIS to your own PostgreSQL password (or set the DB_PASSWORD environment variable)
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  # Base64 secret, dev only. Use an environment variable in real deployments.
  secret: ${JWT_SECRET:he9bUW2ljok1yu7uRlBPgihSinoaxgLI18QogazHmgQcykn1NBwk5Mrh4mZItg3k}
  expiration-ms: 86400000 # 24 hours

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
